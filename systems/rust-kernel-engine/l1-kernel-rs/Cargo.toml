[package]
name = "l1-kernel-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Contract-only Rust boundary for the Praxis L1 kernel migration"
autotests = false

[dependencies]
hmac = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[lib]
name = "l1_kernel_rs"
path = "src/lib.rs"

[[bin]]
name = "rust-session-store-probe"
path = "src/bin/rust-session-store-probe.rs"

[[bin]]
name = "rust-kernel-preflight"
path = "src/bin/rust-kernel-preflight.rs"

[[bin]]
name = "rust-kernel-entry"
path = "src/bin/rust-kernel-entry.rs"

# Keep the historical target names stable while making the test domain explicit.
# Tests are grouped by boundary under tests/<domain>/; the Python infra gate
# verifies that every target is registered here and that the root stays empty.
[[test]]
name = "agent_loop"
path = "tests/session/kernel_test_agent_loop.rs"

[[test]]
name = "agent_loop_execution"
path = "tests/runtime/kernel_test_agent_loop_execution.rs"

