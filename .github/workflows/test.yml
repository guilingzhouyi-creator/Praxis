name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Full per-directory suite runs once on the reference Python (3.11); the
    # other matrix versions run a cross-version smoke (L1/L2/infra slices)
    # instead of duplicating the whole 11-step walk 4x. Static gates, coverage
    # and random-order already run on a single version (see below), so the
    # cross-version matrix only needs to prove interpreter compatibility.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one version failing must not cancel the others
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install mypy==1.15.0 types-PyYAML  # mypy pinned to pre-commit version
        timeout-minutes: 5

      # Cross-version smoke (non-3.11): fast interpreter-compatibility proof
      # via the runner slices — no need to re-run the full suite on every
      # Python. The 3.11 job below covers behavior exhaustively.
      - name: Cross-version smoke (L1/L2/infra slices)
        if: matrix.python-version != '3.11'
        run: |
          python tests/runner.py --slice l1 --maxfail=5
          python tests/runner.py --slice l2 --maxfail=5
          python tests/runner.py --slice infra --maxfail=5
        timeout-minutes: 10

      # Full suite — reference Python only. -n auto comes from pyproject
      # addopts (parallel across files, serial within a file via --dist
      # loadfile). Small/quick steps pin -n 0 to avoid xdist spawn overhead;
      # directory steps keep the default -n auto.
      - name: L1 Kernel
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l1/ -n 0 --maxfail=5 -q --tb=short
        timeout-minutes: 5

      - name: L2 Shell
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l2/ --maxfail=5 -q --tb=short
        timeout-minutes: 10

      - name: L3 Cell + Tools
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/l3/cell/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/tools/ --maxfail=5 -q --tb=short --durations=15
          python -m pytest tests/l3/tool_system/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/bus/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/config/ --maxfail=5 -q --tb=short
        timeout-minutes: 20

      - name: L3 Memory
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l3/memory/ --maxfail=5 -q --tb=short -k "not r4"
        timeout-minutes: 10

      - name: L3 Memory R4 (slow)
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l3/memory/ --maxfail=5 -q --tb=short -k "r4"
        timeout-minutes: 15

      - name: L3 Remaining (agent/card/l3a/services/scheduler/boot/...)
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/l3/agent/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/agent_terminal/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/boot/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/card/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/error_bus/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/identity/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/l3a/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/scheduler/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/services/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/session/ --maxfail=5 -q --tb=short
        timeout-minutes: 20

      - name: L3 Discussion + SubAgent
        if: matrix.python-version == '3.11'
        run: |
          python -m pytest tests/l3/discussion/ --maxfail=5 -q --tb=short
          python -m pytest tests/l3/subagent/ --maxfail=5 -q --tb=short
        timeout-minutes: 10

      - name: L3 Root (approval / tool-ring / prompt-engine / ...)
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l3/test_*.py -n 0 --maxfail=5 -q --tb=short
        timeout-minutes: 5

      - name: L4 Bridge
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l4/ --maxfail=5 -q --tb=short
        timeout-minutes: 20

      - name: L5 User Layer
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/l5/ -n 0 --maxfail=5 -q --tb=short
        timeout-minutes: 3

      - name: Integration
        if: matrix.python-version == '3.11'
        run: python -m pytest tests/integration/ --maxfail=5 -q --tb=short
        timeout-minutes: 5

      - name: Summary
        run: echo "CI completed for Python ${{ matrix.python-version }}"
        timeout-minutes: 1

  static:
    # Version-independent gates (layer imports, endpoint manifest, structural
    # hooks, type check): run once on 3.12 instead of three times in the
    # matrix — the per-directory test steps of the test job still cover
    # 3.12/3.13/3.14. Further parallelization (splitting the matrix job into
    # per-directory jobs) would trade setup/install duplication for wall
    # time; do it only after verifying on CI, not from a branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install mypy==1.15.0 types-PyYAML  # mypy pinned to pre-commit version
        timeout-minutes: 5
      - name: Cache pre-commit hook environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            precommit-${{ runner.os }}-
      - name: Infra (layer imports / params / registration contracts)
        run: python -m pytest tests/infra/ -n 0 --maxfail=5 -q --tb=short
        timeout-minutes: 3
      - name: System boundary manifest
        run: python scripts/py/check_system_boundaries.py
        timeout-minutes: 1
      - name: API endpoint manifest
        run: python -m l4.api.api_endpoints
        timeout-minutes: 1
      - name: Pre-commit structural hooks
        run: |
          for hook in trailing-whitespace end-of-file-fixer check-yaml check-json check-added-large-files check-merge-conflict detect-private-key; do
            pre-commit run "$hook" --all-files || exit 1
          done
        timeout-minutes: 5
      - name: Type check (mypy)
        run: mypy systems/python-reference-runtime/ --no-namespace-packages --ignore-missing-imports --allow-untyped-calls --allow-untyped-decorators
        timeout-minutes: 10

  coverage:
    # PR coverage gate: full suite + fail-under (mirrors pyproject
    # [tool.coverage.report] fail_under = 60) and uploads the XML report to
    # Codecov for trend tracking. Runs on a single Python version — the matrix
    # test job already covers cross-version behavior.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
        timeout-minutes: 5
      - name: Full suite with coverage
        run: python -m pytest tests/ -q --tb=short --cov=systems/python-reference-runtime --cov-report=xml --cov-report=term --cov-fail-under=60 --ignore=tests/benchmarks/bench_card.py
        timeout-minutes: 30
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          fail_ci_if_error: false

  random-order:
    # State-isolation gate: run the full suite in randomized order so
    # order-dependent pollution (i18n locale, SkillManager usage counters,
    # singleton leaks) fails instead of only under an unlucky schedule.
    # The seed is the workflow run id — every run exercises a different
    # order, and a failure can be reproduced locally with the run id from
    # the Actions UI: pytest tests/ --random-order-seed=<run_id>.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
        timeout-minutes: 5
      - name: Full suite in randomized order
        run: python -m pytest tests/ --random-order-seed=${{ github.run_id }} --maxfail=3 -q --tb=short
        timeout-minutes: 30
