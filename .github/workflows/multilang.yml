name: Multi-language Build

on:
  push:
    branches: [main]
    paths:
      - "systems/rust-kernel-engine/**"
      - "rust-toolchain.toml"
      - "systems/typescript-shell-engine/**"
      - "tests/fixtures/protocol_v1_records.json"
      - "Makefile"
      - ".github/workflows/multilang.yml"
  pull_request:
    branches: [main]
    paths:
      - "systems/rust-kernel-engine/**"
      - "rust-toolchain.toml"
      - "systems/typescript-shell-engine/**"
      - "tests/fixtures/protocol_v1_records.json"
      - "Makefile"
      - ".github/workflows/multilang.yml"
  workflow_dispatch:

concurrency:
  group: multilang-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: systems/typescript-shell-engine/package-lock.json
      - name: Install TypeScript dependencies
        run: npm ci --prefix systems/typescript-shell-engine
      - name: TypeScript protocol tests
        run: npm test --prefix systems/typescript-shell-engine
      - name: TypeScript typecheck
        run: npm run typecheck --prefix systems/typescript-shell-engine

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: systems/rust-kernel-engine
      - name: Rust tests
        run: cargo test --workspace --manifest-path systems/rust-kernel-engine/Cargo.toml
      - name: Rust format check
        run: cargo fmt --manifest-path systems/rust-kernel-engine/Cargo.toml --all -- --check
      - name: Rust clippy
        run: cargo clippy --manifest-path systems/rust-kernel-engine/Cargo.toml --workspace --all-targets --all-features -- -D warnings
