name: comment-audit

on:
  push:
    branches: [main]
    paths:
      - "systems/python-reference-runtime/**"
      - "scripts/py/check_comments.py"
  pull_request:
    branches: [main]
    paths:
      - "systems/python-reference-runtime/**"
      - "scripts/py/check_comments.py"
  workflow_dispatch:

jobs:
  comment-audit:
    # Advisory hygiene gate: reports CJK/mojibake/non-ASCII residue and
    # missing docstrings per AGENTS.md comment conventions. Hard issues
    # (CJK — now covering the full CJK plane incl. kana/hangul/fullwidth,
    # mojibake, non-ASCII residue via --non-ascii, missing module
    # docstring) fail; advisory findings (missing class/function
    # docstrings, short docs) are reported without blocking the merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run comment audit
        run: |
          python scripts/py/check_comments.py systems/python-reference-runtime --non-ascii
