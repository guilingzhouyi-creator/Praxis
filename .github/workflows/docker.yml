name: Docker

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "src/**"
      - "config/**"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker-compose.yml"
      - "pyproject.toml"
      - "src/**"
      - "config/**"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Verify every Dockerfile target builds — a broken Dockerfile should never
    # reach main unnoticed. Builds only; images are not pushed or published.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [kernel, api, sandbox, llm, supervisor]
    steps:
      - uses: actions/checkout@v7

      - name: Build target ${{ matrix.target }}
        run: docker build --target ${{ matrix.target }} --tag praxis:${{ matrix.target }} .

  publish:
    # Publish GHCR images on main and version-tag pushes. Tag scheme:
    # <branch|-semver>-<target> (e.g. main-kernel, v0.4.2-api) plus a
    # <sha>-<target> short-SHA tag for every push.
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [kernel, api, sandbox, llm, supervisor]
    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/praxis
          tags: |
            type=ref,event=branch,suffix=-${{ matrix.target }}
            type=semver,pattern={{version}},suffix=-${{ matrix.target }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.target }}
            type=sha,prefix=,suffix=-${{ matrix.target }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push target ${{ matrix.target }}
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
