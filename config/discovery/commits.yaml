# Commit-scan policy — SINGLE SOURCE OF TRUTH for commit message gates.
#
# Consumed by the commit scanners so the type/scope whitelist lives in ONE
# place instead of drifting across scripts:
#   - scripts/py/commit_scan.py   (policy engine, used by all gates below)
#   - .githooks/commit-msg        (local commit gate)
#   - scripts/sh/verify-pr-merge.sh (remote PR merge gate)
#   - scripts/py/generate_changelog.py (CHANGELOG typing)
#
# After editing this file, run `python scripts/py/gen_commits_json.py` to
# regenerate config/discovery/commits.json (the Node commit-msg validator
# reads JSON — the two must never drift).
#   - .github/workflows/pr-review.yml (PR advisory comment)
#
# Three-layer config: params/*.py (compile-time) ← this file (structural)
# ← config/praxis.yaml (deployment overrides). Adding a type or scope here
# is the ONLY change needed to teach every gate about it.

# Conventional-Commits type whitelist. Subjects with a type outside this
# list are rejected by every gate.
types:
  - feat
  - fix
  - perf
  - docs
  - refactor
  - style
  - test
  - chore
  - build
  - ci
  - revert
  - sync  # mirror sync commits (auto-generated, e.g. main -> github mirror)

# Scope-to-directory mapping for type-content consistency checks. When a
# commit uses a scope, its changed files should at least touch the
# corresponding directory — e.g. a `feat(kernel)` that does not touch
# src/l1/kernel/ is flagged as suspicious. This is a heuristic advisory,
# not a hard gate (cross-cutting changes may legitimately span directories).
scope_dirs:
  kernel: src/l1/kernel/
  l2: src/l2/
  l3: src/l3/
  l3a: src/l3/cell/peers/l3a/
  l4: src/l4/
  api: src/l4/api/
  llm: src/l4/llm/
  sandbox: src/l4/sandbox/
  l5: src/l5/
  cli: src/l5/
  docs: docs/
  tests: tests/
  scripts: scripts/
  config: config/
  ci: .github/
  judge: docs/
  git: scripts/
  hooks: .githooks/

# Registered authoring agents for Co-Authored-By attribution. The commit-msg
# gate compares the trailer the agent wrote against BOTH this registry and
# the live runtime detection (scripts/py/detect_agent.py): the model name
# must match what the detector reports (an OpenAI/Anthropic model can never
# claim a deepseek run, and vice versa), and the agent name must be one of
# these registered identities. Never attribute a run to a framework that did
# not execute it — the detector reads env + process-chain signals, not the
# agent's self-report.
agents:
  # Refreshed 2026-08-22 against vendor lineups; legacy slugs are KEPT so
  # historical commits still validate under range rescans (never prune them).
  - name: AtomCode
    models: [deepseek-v4-flash, deepseek-v4-pro]
    email: noreply@atomgit.com
  - name: OpenCode
    models: [ox-alpha, deepseek-v4-flash, deepseek-v4-pro]
    email: noreply@opencode.ai
  - name: Claude
    models: [claude, claude-sonnet, claude-opus, claude-opus-5, claude-sonnet-5, claude-fable-5]
    email: noreply@anthropic.com
  - name: DeepSeek
    models: [deepseek-v4-flash, deepseek-v4-pro, deepseek-chat, deepseek-reasoner]
    email: noreply@deepseek.com
  - name: GPT
    models: [gpt-4o, gpt-4o-mini, gpt-5, gpt-5-mini, gpt-5.6-sol, gpt-5.6-terra, gpt-5.6-luna]
    email: noreply@openai.com
  # ── Open-weight vendors (added 2026-08-22) ──
  - name: Kimi
    models: [kimi-k3]
    email: noreply@moonshot.cn
  - name: Qwen
    models: [qwen3.8-max, qwen3.8-27b]
    email: noreply@qwen.ai
  - name: GLM
    models: [glm-5.3, glm-5.2]
    email: noreply@z.ai

