# Commit-scan policy — SINGLE SOURCE OF TRUTH for commit message gates.
#
# Consumed by the commit scanners so the type/scope whitelist lives in ONE
# place instead of drifting across scripts:
#   - scripts/py/_lib/commit_policy.py   (policy engine, exposed via
#     scripts/py/commit_gate.py policy; used by all gates below)
#   - .githooks/commit-msg        (local commit gate)
#   - scripts/sh/gate-merge.sh pr (remote PR merge gate)
#   - scripts/py/_lib/changelog_render.py (CHANGELOG typing, via gen_changelog.py)
#   - .github/workflows/pr-review.yml (PR advisory comment)
#
# Three-layer config: params/*.py (compile-time) ← this file (structural)
# ← config/praxis.yaml (deployment overrides). Adding a type or scope here
# is the ONLY change needed to teach every gate about it.

# Conventional-Commits type whitelist. Subjects with a type outside this
# list are rejected by every gate.
types:
  - feat
  - fix
  - perf
  - docs
  - refactor
  - style
  - test
  - chore
  - build
  - ci
  - revert
  - sync  # mirror sync commits (auto-generated, e.g. main -> github mirror)

# Imperative-mood guard — single source of truth for BOTH scripts/py/
# _lib/commit_policy.py and scripts/js/validate-commit.mjs (via the commits.json
# mirror). A summary whose FIRST word appears in this list (past tense or
# gerund forms) is rejected: subjects must start with an imperative
# present-tense verb (add, fix, update, refactor, ...). Edit here, then run
# `python scripts/py/gen_commits_json.py` to resync the Node side.
non_imperative_verbs:
  [added, adding, fixes, fixed, fixing, updated, updating, updates,
   changes, changed, changing, modified, modifying, modifies,
   refactored, refactoring, refactors, improves, improved, improving,
   removes, removed, removing, deletes, deleted, deleting,
   makes, made, making, creates, created, creating,
   implements, implemented, implementing, hardens, hardened, hardening,
   enforces, enforced, enforcing, handles, handled, handling,
   resolves, resolved, resolving, prevents, prevented, preventing,
   allows, allowed, allowing, avoids, avoided, avoiding,
   cleans, cleaned, cleaning]

# Type-to-file content rules (must_include) — single source of truth for
# BOTH scripts/py/_lib/commit_policy.py (Python) and scripts/js/validate-commit.mjs
# (Node, via the commits.json mirror). Edit here, then run
# `python scripts/py/gen_commits_json.py` to resync the Node side.
type_content_rules:
  feat: [systems/python-reference-runtime/, systems/rust-kernel-engine/, systems/typescript-shell-engine/, scripts/, .githooks/, config/]
  fix: [systems/python-reference-runtime/, systems/rust-kernel-engine/, systems/typescript-shell-engine/, scripts/, .githooks/, config/]
  refactor: [systems/python-reference-runtime/, systems/rust-kernel-engine/, systems/typescript-shell-engine/, scripts/, .githooks/, config/]
  perf: [systems/python-reference-runtime/, systems/rust-kernel-engine/, systems/typescript-shell-engine/]
  test: [tests/, systems/rust-kernel-engine/, systems/typescript-shell-engine/]
  ci: [.github/]

# Scope-to-directory mapping for type-content consistency checks. When a
# commit uses a scope, its changed files should at least touch the
# corresponding directory — e.g. a `feat(kernel)` that does not touch
# systems/python-reference-runtime/l1/kernel/ is flagged as suspicious. This is a heuristic advisory,
# not a hard gate (cross-cutting changes may legitimately span directories).
scope_dirs:
  kernel: systems/python-reference-runtime/l1/kernel/
  l2: systems/python-reference-runtime/l2/
  l3: systems/python-reference-runtime/l3/
  l3a: systems/python-reference-runtime/l3/cell/peers/l3a/
  l4: systems/python-reference-runtime/l4/
  api: systems/python-reference-runtime/l4/api/
  llm: systems/python-reference-runtime/l4/llm/
  sandbox: systems/python-reference-runtime/l4/sandbox/
  l5: systems/python-reference-runtime/l5/
  cli: systems/python-reference-runtime/l5/
  docs: docs/
  tests: tests/
  scripts: scripts/
  config: config/
  ci: .github/
  judge: docs/
  git: scripts/
  hooks: .githooks/
  rust: systems/rust-kernel-engine/

