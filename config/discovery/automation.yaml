# Declarative automation workflows for the build/performance perimeter.
# Commands are argument arrays, never shell strings; the runner resolves
# ``python`` to the active interpreter and executes through ProcessPort.
automation:
  schema_version: 1
  defaults:
    timeout_s: 180
  workflows:
    performance:
      description: "Run per-layer scans and the independent Rust/Python R2 evidence bundle."
      steps:
        - id: l2_protocol
          command:
            - python
            - tests/benchmarks/bench_l2_protocol.py
            - --iterations
            - "5000"
            - --warmups
            - "3"
            - --samples
            - "7"
            - --json
            - .praxis/automation/l2-protocol.json
        - id: perf_quality
          depends_on: [l2_protocol]
          timeout_s: 300
          command:
            - python
            - scripts/py/perf_quality.py
            - --run-json
            - .praxis/automation/perf-quality.json
        - id: r2_baseline_bundle
          depends_on: [perf_quality]
          timeout_s: 600
          command:
            - python
            - scripts/py/r2_baseline_bundle.py
            - --output
            - .praxis/automation/r2-baseline-bundle.json
        - id: r2_baseline_analysis
          depends_on: [r2_baseline_bundle]
          timeout_s: 60
          command:
            - python
            - scripts/py/r2_baseline_analyze.py
            - --input
            - .praxis/automation/r2-baseline-bundle.json
            - --output
            - .praxis/automation/r2-baseline-analysis.json
